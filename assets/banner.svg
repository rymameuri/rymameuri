<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Rym Ameuri — software engineer">
  <defs>
    <!-- tartan weave, pulled from the profile photo: navy ground, red + green + mustard threads -->
    <pattern id="tartan" width="96" height="96" patternUnits="userSpaceOnUse">
      <rect width="96" height="96" fill="#1B2540"/>
      <rect y="8"  width="96" height="22" fill="#2F5D50" opacity=".55"/>
      <rect y="56" width="96" height="10" fill="#B5352F" opacity=".6"/>
      <rect y="40" width="96" height="2"  fill="#D9A441" opacity=".7"/>
      <rect x="8"  width="22" height="96" fill="#2F5D50" opacity=".55"/>
      <rect x="56" width="10" height="96" fill="#B5352F" opacity=".6"/>
      <rect x="40" width="2"  height="96" fill="#D9A441" opacity=".7"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"  stop-color="#0D1117" stop-opacity=".92"/>
      <stop offset=".6" stop-color="#0D1117" stop-opacity=".75"/>
      <stop offset="1"  stop-color="#0D1117" stop-opacity=".35"/>
    </linearGradient>
    <style>
      .name  { font: 700 64px Georgia, 'Times New Roman', serif; fill: #F6DDC2; }
      .tag   { font: 400 24px 'SF Mono', Menlo, Consolas, monospace; fill: #D9A441; }
      .small { font: 400 18px 'SF Mono', Menlo, Consolas, monospace; fill: #E9B7A5; }
      .in    { opacity: 0; animation: rise .9s ease-out forwards; }
      .d1 { animation-delay: .15s } .d2 { animation-delay: .45s } .d3 { animation-delay: .75s }
      @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
      .drift { animation: drift 24s linear infinite; }
      @keyframes drift { from { transform: translate(0,0) } to { transform: translate(-96px,-96px) } }
    </style>
  </defs>
  <rect width="1200" height="280" fill="#1B2540"/>
  <g class="drift"><rect x="0" y="0" width="1400" height="480" fill="url(#tartan)"/></g>
  <rect width="1200" height="280" fill="url(#fade)"/>
  <rect x="0" y="270" width="1200" height="10" fill="#B5352F"/>
  <text class="name in d1" x="60" y="130">Rym Ameuri</text>
  <text class="tag in d2"  x="62" y="178">software engineer · builder · CMU</text>
  <text class="small in d3" x="62" y="218">currently building → see below  ↓</text>
</svg>
